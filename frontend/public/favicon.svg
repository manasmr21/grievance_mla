<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circle with Gradient and Shadow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Shield Shape inside -->
  <path d="M256 120 C290 120 360 140 360 180 C360 270 290 350 256 380 C222 350 152 270 152 180 C152 140 222 120 256 120 Z" 
        fill="url(#shieldGrad)" />

  <!-- Checkmark inside Shield representing Resolved/Processed -->
  <path d="M210 245 L245 280 L305 200" 
        fill="none" 
        stroke="url(#bgGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>